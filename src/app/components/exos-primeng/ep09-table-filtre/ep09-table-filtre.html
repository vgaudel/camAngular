<h3>Exercice 9 — Recherche globale dans un tableau</h3>

<p-toolbar>
  <ng-template pTemplate="start">
    <span class="p-input-icon-left">
      <i class="pi pi-search"></i>
      <input pInputText type="text" [(ngModel)]="recherche"
             (input)="filtrer($event)" placeholder="Rechercher..." />
    </span>
  </ng-template>
  <ng-template pTemplate="end">
    <p-button label="Réinitialiser" icon="pi pi-times"
              severity="secondary" (onClick)="reset()" />
  </ng-template>
</p-toolbar>

<p-table #dt [value]="collaborateurs" [paginator]="true" [rows]="5"
         [globalFilterFields]="['nom', 'poste']">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="nom">Nom <p-sortIcon field="nom" /></th>
      <th pSortableColumn="poste">Poste <p-sortIcon field="poste" /></th>
      <th pSortableColumn="salaire">Salaire <p-sortIcon field="salaire" /></th>
      <th pSortableColumn="dateEmbauche">Embauche <p-sortIcon field="dateEmbauche" /></th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-c>
    <tr>
      <td>{{ c.nom }}</td>
      <td>{{ c.poste }}</td>
      <td>{{ c.salaire | currency:'EUR' }}</td>
      <td>{{ c.dateEmbauche | date:'dd/MM/yyyy' }}</td>
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr><td colspan="4">Aucun résultat</td></tr>
  </ng-template>
</p-table>
