<h3>Exercice 12 — Toast de notifications</h3>

<p-toast />

<div class="flex gap-2 flex-wrap">
  <p-button label="Success" severity="success" (onClick)="success()" />
  <p-button label="Info"    severity="info"    (onClick)="info()" />
  <p-button label="Warn"    severity="warn"    (onClick)="warn()" />
  <p-button label="Error"   severity="danger"  (onClick)="error()" />
</div>
