<h3>Exercice 14 — Formulaire d'inscription</h3>

<p-toast />

<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-3 w-96">

  <div class="flex flex-col gap-1">
    <label for="nom">Nom</label>
    <input pInputText id="nom" formControlName="nom"
           [class.ng-invalid]="f.nom.invalid && f.nom.touched"
           [class.ng-dirty]="f.nom.touched" />
    @if (f.nom.invalid && f.nom.touched) {
      <p-message severity="error" text="Nom requis" />
    }
  </div>

  <div class="flex flex-col gap-1">
    <label for="email">Email</label>
    <input pInputText id="email" formControlName="email"
           [class.ng-invalid]="f.email.invalid && f.email.touched"
           [class.ng-dirty]="f.email.touched" />
    @if (f.email.invalid && f.email.touched) {
      <p-message severity="error" text="Email invalide" />
    }
  </div>

  <div class="flex flex-col gap-1">
    <label for="pwd">Mot de passe</label>
    <p-password id="pwd" formControlName="motDePasse"
                [toggleMask]="true" [feedback]="true" styleClass="w-full" />
    @if (f.motDePasse.invalid && f.motDePasse.touched) {
      <p-message severity="error" text="8 caractères minimum" />
    }
  </div>

  <div class="flex flex-col gap-1">
    <label>Date de naissance</label>
    <p-datePicker formControlName="dateNaissance" dateFormat="dd/mm/yy"
                  [showIcon]="true" />
    @if (f.dateNaissance.invalid && f.dateNaissance.touched) {
      <p-message severity="error" text="Date requise" />
    }
  </div>

  <div class="flex flex-col gap-1">
    <label>Rôle</label>
    <p-select formControlName="role" [options]="roles"
              optionLabel="label" optionValue="value" />
  </div>

  <div class="flex items-center gap-2">
    <p-checkbox formControlName="accepteCGU" [binary]="true" inputId="cgu" />
    <label for="cgu">J'accepte les CGU</label>
  </div>
  @if (f.accepteCGU.invalid && f.accepteCGU.touched) {
    <p-message severity="error" text="Vous devez accepter les CGU" />
  }

  <p-button type="submit" label="Créer le compte" [disabled]="form.invalid" />
</form>
